<style>
/* ===== 1. TOKENS ===== */

/* ===== 2. BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{color:var(--w);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.2}

.act,.stat,.badge,.dot,.bt,.chip,.mut{font-variant-numeric:tabular-nums}
.ph{margin-bottom:14px}.sh{margin:18px 0 10px}
/* ===== 3. COMPONENTES ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0;white-space:nowrap}

.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}

.btn.lg{padding:13px 22px;width:100%}
.card{margin-bottom:12px}
.card.hv{transition:.18s;width:100%;display:block}
input,textarea,select{width:100%;font-size:16px;letter-spacing:inherit}
::placeholder{opacity:1}
input:focus,textarea:focus,select:focus{outline:0}
textarea{resize:none;display:block}
select option{background:var(--s)}
.fl{display:block;font-size:13px;color:var(--g);margin-bottom:12px}
.fl>input,.fl>textarea,.fl>select{margin-top:6px;color:var(--w)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}.c{justify-content:center;text-align:center}
.mut{color:var(--g)}.err{font-size:13px;min-height:20px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk{color:inherit;text-align:left}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--s2);color:var(--o);overflow:hidden;flex:none;object-fit:cover}
.av.f1{box-shadow:0 0 0 2px var(--n),0 0 0 4px var(--o)}.av.f2{box-shadow:0 0 0 2px var(--n),0 0 0 4px var(--o),0 0 0 6px var(--w)}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--g);position:relative;flex:none;cursor:pointer}.ib:hover{background:var(--s2);color:var(--w)}
.act{display:flex;align-items:center}.act:hover{background:var(--s2)}
.tx{margin:10px 0;white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.6}
.pimg{width:100%;object-fit:cover;margin-bottom:10px;display:block}
/* comunidades */
.cover{position:relative}
.cicon{position:absolute;left:10px;bottom:-12px;width:44px;height:44px;border-radius:12px;background-size:cover;background-position:center;border:3px solid var(--s)}
.cicon.mid{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:18px}
.chatc{height:calc(100vh - 380px);min-height:380px}
.crow{display:flex;gap:8px;align-items:flex-end}.crow.me{justify-content:flex-end}.crow.pend{opacity:.6}
.cbx{display:flex;flex-direction:column;max-width:78%;min-width:0}.crow.me .cbx{align-items:flex-end}.cbx .bub{max-width:100%}
@media(max-width:900px){.chatc{height:calc(100dvh - 400px);min-height:340px}}
/* comunidades: alinhamento */
.cm-top{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.cm-top .srch2,.cm-top input{flex:1;min-width:0}
.cm-top input{border-radius:999px;padding:10px 16px;font-size:15px}
.cm-top .btn{flex:none}
.cm-chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none;flex-wrap:nowrap}
.cm-chips::-webkit-scrollbar{display:none}
.cm-chips .chip{flex:none;white-space:nowrap}
.cm-chips:empty{display:none}
.cm .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding:14px 16px 16px}
.cm .grid .card.hv{min-width:0;overflow:hidden;text-align:left}
.cm .empty{margin:24px 16px}
/* perfil */
.epv{border:1px solid var(--s2);border-radius:var(--r);overflow:hidden;margin-bottom:14px;background:var(--s)}.epv .cb{border-radius:0}
.pst{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13.5px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--o);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--o) 25%,transparent)}
.swr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cs{width:44px;height:30px;border-radius:10px;border:2px solid transparent;transition:.15s}.cs.on{border-color:var(--w)}
.as{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 2px var(--s)}.as.on{border-color:var(--w)}
.ccol{width:34px;height:34px;padding:0;border:0;background:none;border-radius:50%;cursor:pointer}
.chip.lk{text-decoration:none;display:inline-block}
.sect{font-size:13px;color:var(--g);margin:2px 0 8px}
/* comentários */
.cmts{margin-top:12px;padding-top:14px}
.chead{font-family:var(--fh);font-weight:600;font-size:14px;margin-bottom:12px}
.cth{display:flex;flex-direction:column;gap:14px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cbd{flex:1;min-width:0}
.cbub{border-radius:4px 16px 16px 16px}
.chd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px}.chd .mut{font-size:12px}
.cau{margin:0!important;padding:0 8px!important}
.ctx{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.5;margin-top:3px}
.rto{color:var(--o);font-weight:600}
.cmeta{display:flex;gap:14px;margin:4px 0 0 8px}
.cmeta button,.cmore{font-size:12.5px;font-weight:600;color:var(--g)}

.crs{margin:8px 0 0 44px}
.creps{margin-top:10px;padding-left:12px;border-left:2px solid var(--s2);display:flex;flex-direction:column;gap:12px}
.crp{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:6px 12px;border-radius:12px;background:var(--s2);font-size:13px;color:var(--g)}.crp b{color:var(--w)}
.cmbox{margin-bottom:16px}.cmbox .cin2{margin-top:0}.cmbox .crp{margin:0 0 8px}
.cin2{display:flex;gap:8px;align-items:center;margin-top:14px}.cin2 input{border-radius:999px}
.chip{padding:6px 14px;border-radius:999px}.chip:hover{color:var(--w)}.chip.on{font-weight:700}
.tag{display:inline-block;margin-bottom:6px}
.tabs{display:flex;margin-bottom:14px;overflow-x:auto}
.tabs button{border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--w)}.tabs button.on{border-color:var(--o)}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.ac{display:grid;gap:12px}.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{flex:1 1 auto}
.stt{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--s2);color:var(--g);text-transform:capitalize}
.stt.pendente{background:#ffc83b22;color:#ffc83b}.stt.confirmado{background:#2fd07a22;color:#2fd07a}.stt.recusado{background:#ff5d5d22;color:var(--red)}
.rb.admin{background:var(--s3);color:var(--w)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.grid .card{margin:0}
.cover{height:96px;display:grid;place-items:center;font-family:var(--fh);font-size:34px;font-weight:800;color:#fff;margin-bottom:10px;background-size:cover;background-position:center}
.badge{border-radius:999px;font-size:11px;padding:2px 8px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.dot{position:absolute;top:0;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;font-size:10px;font-weight:700;display:grid;place-items:center}
.note{font-size:12px;color:var(--g);margin-top:12px}
.empty{text-align:center;padding:36px 20px;border-radius:var(--r);margin-bottom:12px;display:grid;gap:6px;justify-items:center}
.empty .ei{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.empty .btn{margin-top:8px}
.sw{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;color:var(--w);font-size:15px}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:44px;height:26px;border-radius:99px;background:var(--s3);position:relative;transition:.2s;flex:none}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--o)}.sw input:checked+i:after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--o);outline-offset:2px}
.mo{position:fixed;inset:0;display:grid;place-items:center;padding:12px;z-index:50}
.md{padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto;animation:pop .2s}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.md form,.md>div+div{display:block}
@keyframes pop{from{transform:scale(.96);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.stack>*+*{margin-top:8px}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:10px 20px;z-index:99;text-align:center}
.cb{aspect-ratio:3/1;min-height:100px;background-size:cover;background-position:center}.cb.sm{height:90px;aspect-ratio:auto;min-height:0}
.stat{display:flex;gap:18px;margin-top:10px;color:var(--g);font-size:14px}.stat b{color:var(--w)}
.prof{position:relative}
.ghost{border-radius:999px}

.perks{list-style:none;margin:14px 0}.perks li{display:flex;gap:10px;align-items:center;padding:6px 0}.perks svg{color:var(--o)}
.side-i{width:100%;padding:8px 0;gap:12px}.side-i .cover{width:42px;height:42px;font-size:18px;margin:0;border-radius:12px;flex:none}
/* composer */
.cmp-box{display:flex;gap:12px}
.cmp-box textarea{background:transparent;min-height:52px}

.cmp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--s2);margin-top:8px}
.rm{position:absolute;top:8px;right:8px;background:#000a;color:#fff;width:30px;height:30px}
/* landing */
.land{grid-column:1/-1;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px;position:relative;overflow:hidden}

.hero{position:relative;z-index:1;max-width:520px;text-align:center;display:grid;gap:18px;justify-items:center}
/* login */
.lw{position:relative;z-index:1;display:grid;gap:56px;align-items:center;max-width:1000px;width:100%}
.lw .hero{text-align:left;justify-items:start}
.authc{padding:28px;width:100%;max-width:420px;justify-self:end}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px}
.seg button{padding:9px;color:var(--g);font-weight:600;transition:.18s}.seg button.on{color:var(--w)}
.pw{position:relative;margin-top:6px}.pw input{padding-right:84px}

.meter{display:flex;gap:6px;margin:-4px 0 6px}.meter i{flex:1;height:4px;border-radius:4px;background:var(--s3);transition:.2s}
.meter i.on1{background:var(--red)}.meter i.on2{background:#ffc83b}.meter i.on3{background:var(--ok,#2fd07a)}

.nl{display:flex;align-items:center;margin-bottom:2px;position:relative}

.me-card{margin-top:auto;padding-top:14px;border-top:1px solid var(--s2)}

/* ===== 5. TEMA X · Groove ===== */
:root{--n:#000;--bg:#000;--bgi:none;--s:#16181C;--s2:#2F3336;--s3:#3E4144;--w:#E7E9EA;--g:#71767B;--o:#9F1239;--on:#fff;--inp:#000;--ibd:#333639;--srch:#202327;--pop:#000;--bar:rgba(0,0,0,.65);--pill:rgba(0,0,0,.92);--hv2:rgba(255,255,255,.03);--bsec:#536471;--ovl:rgba(0,0,0,.35);--glow:rgba(255,255,255,.2);--tc:#000000;--ok:#00BA7C;--red:#F4212E;--pink:#F91880;--r:16px;--hov:rgba(231,233,234,.1);--fh:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--fb:var(--fh)}
body{transition:background-color .35s}
/* Claro: fundo branco com gradiente cinza muito leve */
body[data-t=claro]{color-scheme:light;--n:#FFFFFF;--bg:#FFFFFF;--bgi:radial-gradient(900px 500px at 90% -10%,rgba(159,18,57,.05),transparent 60%),linear-gradient(180deg,#FFFFFF 0%,#F5F7F9 100%);
 --s:#F2F4F6;--s2:#E1E5E9;--s3:#C9CFD5;--w:#0F1419;--g:#56616B;--o:#9F1239;--on:#fff;
 --hov:rgba(15,20,25,.07);--inp:#FFFFFF;--ibd:#CBD2D8;--srch:#EDF0F2;--pop:#FFFFFF;--bar:rgba(255,255,255,.8);--pill:rgba(255,255,255,.95);--hv2:rgba(15,20,25,.03);--bsec:#B3BCC4;--ovl:rgba(15,20,25,.3);--glow:rgba(15,20,25,.2);--tc:#FFFFFF}
/* Cinza: grafite médio, neutro */
body[data-t=cinza]{--n:#2E3135;--bg:#2E3135;--bgi:linear-gradient(180deg,#363A3F 0%,#2E3135 55%,#282B2F 100%);
 --s:#3A3E43;--s2:#4B4F55;--s3:#5E636A;--w:#F1F2F4;--g:#AEB3BA;--o:#D93B66;--on:#fff;
 --hov:rgba(255,255,255,.1);--inp:#26292C;--ibd:#575C63;--srch:#3C4045;--pop:#35383D;--bar:rgba(46,49,53,.78);--pill:rgba(46,49,53,.95);--hv2:rgba(255,255,255,.045);--bsec:#6D727A;--ovl:rgba(0,0,0,.45);--glow:rgba(0,0,0,.45);--tc:#2E3135}
/* Escuro: preto puro (mesmos valores base do Padrão) */
body[data-t=escuro]{--n:#000;--bg:#000;--bgi:none;--tc:#000000}
/* conversa com tema próprio: paleta escura independente do tema do app */
.pane[data-th]:not([data-th=pad]){color-scheme:dark;--w:#E7E9EA;--g:#9AA0A6;--s:#16181C;--s2:#2F3336;--s3:#3E4144;--inp:rgba(0,0,0,.35);--ibd:#333639;--hov:rgba(231,233,234,.1);--hv2:rgba(255,255,255,.03);color:var(--w)}
/* Oceano: azul profundo com gradiente suave */
body[data-t=oceano]{--n:#061A2E;--bg:#061A2E;--bgi:radial-gradient(900px 520px at 88% -8%,rgba(59,163,255,.20),transparent 62%),radial-gradient(800px 500px at -6% 108%,rgba(20,110,200,.18),transparent 60%),linear-gradient(180deg,#08213A 0%,#061A2E 52%,#04111F 100%);
 --s:#0E2A44;--s2:#1D4062;--s3:#2B5A83;--w:#E8F3FC;--g:#86A3BD;--o:#3BA3FF;--on:#031322;
 --hov:rgba(130,195,255,.11);--inp:#07213A;--ibd:#24496D;--srch:#0F2C49;--pop:#0A2339;--bar:rgba(6,26,46,.68);--pill:rgba(6,26,46,.93);--hv2:rgba(120,190,255,.05);--bsec:#4C7497;--ovl:rgba(2,12,24,.5);--glow:rgba(59,163,255,.28);--tc:#061A2E}
/* Floresta: verde musgo com gradiente suave */
body[data-t=floresta]{--n:#06180F;--bg:#06180F;--bgi:radial-gradient(900px 520px at 88% -8%,rgba(0,186,124,.17),transparent 62%),radial-gradient(800px 500px at -6% 108%,rgba(30,120,70,.17),transparent 60%),linear-gradient(180deg,#09211A 0%,#06180F 52%,#04110A 100%);
 --s:#0F2A1E;--s2:#1E4132;--s3:#2D5B46;--w:#E6F5EC;--g:#84A593;--o:#00BA7C;--on:#02150C;
 --hov:rgba(120,230,175,.11);--inp:#08241A;--ibd:#25503C;--srch:#102C20;--pop:#0A2118;--bar:rgba(6,24,15,.68);--pill:rgba(6,24,15,.93);--hv2:rgba(120,230,175,.05);--bsec:#4B7A63;--ovl:rgba(2,12,6,.5);--glow:rgba(0,186,124,.26);--tc:#06180F}
body{background-color:var(--bg);background-image:var(--bgi);background-attachment:fixed;font:15px/20px var(--fb);letter-spacing:0;font-feature-settings:normal}
::selection{background:color-mix(in srgb,var(--o) 40%,transparent)}
::placeholder{color:var(--g)}
*{scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
h1,h2,h3,h4{letter-spacing:0;font-weight:800}h2{font-size:20px}h3{font-size:20px}h4{font-size:15px}b{font-weight:700}
.mut{font-size:15px;line-height:20px}.err{color:var(--red)}
/* botões */
.btn{border-radius:999px;min-height:36px;padding:0 16px;font-weight:700;background:var(--o);color:var(--on)}
.btn:hover{transform:none;filter:brightness(.92)}

.bub.me{background:var(--o);color:#fff}.bub{background:var(--s2)}.bub .lk,.lnk:hover,.cmeta button:hover,.cmore:hover{color:var(--o)}
.prem{background:var(--s);border:0}

.seg{background:var(--s);border-radius:999px}.seg button{border-radius:999px}.seg button.on{background:var(--s3);box-shadow:none}
